  <script>
    // Front door start-up: the app-shaped loading screen is drawn at once (Google takes a few seconds to load the app),
    // in the theme and account type used last time, and stays until the app says it is ready.
    (function () {
      var h = document.documentElement, t = '', r = '';
      try { t = localStorage.getItem('GHL_FD_THEME') || ''; r = localStorage.getItem('GHL_FD_ROLE') || ''; } catch (e) {}
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      h.setAttribute('data-theme', t);
      // Android colours its own top/bottom bars from theme-color: use the app's theme from the start (a light phone setting gave a white strip under a dark app)
      var tc = t === 'light' ? '#f2f2f7' : '#000000';
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', tc); m.removeAttribute('media'); });
      // Someone signed in on this device → the app-shaped loading screen; nobody (e.g. after logout) → a plain launch
      // screen with the logo, so a dashboard skeleton never shows before the Sign In screen
      // A home-screen icon keeps the address it was added with (…?k=key) for ever, so after a sign-out the old key
      // still arrives: a key that was signed out on this device counts as no key (straight to the Sign In screen).
      var urlKey = (location.search.match(/[?&]k=([^&]*)/) || [])[1] || '';
      try { urlKey = decodeURIComponent(urlKey); } catch (e) {}
      var signedOut = '';
      try { signedOut = localStorage.getItem('GHL_SIGNED_OUT_KEY') || ''; } catch (e) {}
      var hasKey = !!urlKey && urlKey !== signedOut;
      try { if (localStorage.getItem('GHL_DEVICE_KEY')) hasKey = true; } catch (e) {}
      window.__fdSignedOut = signedOut;
      h.classList.add(hasKey ? 'boot' : 'fd-launch');
      // signed in: the logo first (like an iPhone app opening), then the app-shaped loading screen
      if (hasKey) { h.classList.add('fd-logo'); setTimeout(function () { h.classList.remove('fd-logo'); }, 900); }
      window.__fdSavedTheme = (function () { try { return localStorage.getItem('GHL_FD_THEME') || ''; } catch (e) { return ''; } })();
      // iPhone/iPad Safari: the toolbar floats over the page, so the app runs underneath it (other phones: no)
      var ua = navigator.userAgent || '';
      if (/iP(hone|ad|od)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) h.classList.add('fd-ios');
      if (window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) h.classList.add('fd-standalone');
      if (r === 'partner') h.classList.add('boot-partner');
    })();

  <style>
    /* The app fills the whole screen. Google's "created by an Apps Script user" bar is only added when the
       app is opened directly, not when it is shown inside another page. */
    html, body { margin: 0; background: #000; }
    html.fd-ios body { min-height: 100vh; min-height: 100lvh; }
    @media (prefers-color-scheme: light) { html, body { background: #f2f2f7; } }
    @media (min-width: 769px) { html, body { background: #1e1e1e; } }
    @media (min-width: 769px) and (prefers-color-scheme: light) { html, body { background: #f5f5f7; } }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; border: 0; display: block; }   /* exactly the visible screen */
    html.fd-ios iframe { position: absolute; height: 100lvh; }   /* iPhone Safari: also under the floating toolbar */
    /* iPhone Safari from the very first frame (before any script runs): the app and its loading screen are as tall as the
       page area + Safari's toolbar, so no band ever shows below the loading screen (the script fine-tunes it right after) */
    html.fd-ios:not(.fd-standalone) iframe { height: calc(100lvh + 58px); }
    html.fd-ios:not(.fd-standalone) body { min-height: calc(100lvh + 58px); }
    /* +160px below the screen: when Safari's pull-to-refresh pushes the page down while it reloads, the loading screen still reaches the bottom (it left a band) */
    html.fd-ios:not(.fd-standalone) #bootScreen { bottom: auto !important; height: calc(100lvh + 58px + 160px) !important; }
    html.fd-ios:not(.fd-standalone) #bootScreen .bs-search, html.fd-ios:not(.fd-standalone) #bootScreen .bs-bolt { bottom: calc(14px + 100lvh + 58px - 100dvh + 160px) !important; }
    html.fd-ios.fd-standalone iframe { position: fixed; }   /* runs under Safari's floating toolbar, like a normal page */
    /* the front door itself never scrolls or shifts: if iPhone nudges it (e.g. after the keyboard closes), taps inside
       the app land above the finger. Only the app inside scrolls. */
    html.fd-standalone, html.fd-standalone body { overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
    html.fd-standalone body { position: fixed; inset: 0; }
    /* iPhone home-screen app (measured 16 Oct, iPhone SE): the screen is 667 tall (vh 667) but the page box is only 647
       (innerHeight 647, the status bar is taken off at the BOTTOM), so a body pinned with inset:0 cut the app off 20pt
       above the bottom = the band. The body is now as tall as the screen. */
    html.fd-ios.fd-standalone, html.fd-ios.fd-standalone body { height: 100vh; }
    html.fd-ios.fd-standalone body { bottom: auto; }
    /* in Safari the page behaves like a normal page, so it runs under Safari's floating toolbar (like any website) */
    #fdProbeL, #fdProbeD { position: fixed; top: 0; left: 0; width: 1px; visibility: hidden; pointer-events: none; }
    #fdProbeL { height: 100lvh; } #fdProbeD { height: 100dvh; }
    /* Home-screen app on iPhone: the page height leaves out the status bar, so the app stopped short and a strip
       showed at the bottom. Add the status-bar height back (only in this mode; Safari itself is unchanged). */
    @media (display-mode: standalone) {
      html.fd-ios iframe { bottom: auto; height: calc(100vh + env(safe-area-inset-top)); }
    }

    html.boot #bootScreen { z-index: 10; transition: opacity .25s ease; }

  <iframe id="app" title="GHL Boys Club" allow="clipboard-write"></iframe>
  <script>
    // "Keep me signed in": the app tells this page its device key, and this page keeps it in its own storage and
    // in its address (?k=…), so a phone home-screen icon opens straight in. The key goes back to the app on load.
    // Home-screen app on iPhone: the page height leaves out the status bar (and on some models iPhone reports that
    // as 0), so the app stopped short and a strip showed at the bottom. Size the app to the real screen height instead.
    (function () {
      var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!standalone) return;
      if (!document.documentElement.classList.contains('fd-ios')) { document.documentElement.classList.add('fd-standalone'); return; }   // only iPhone needs the screen-height fix
      function fit() {
        var portrait = window.matchMedia('(orientation: portrait)').matches;
        var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        var h = Math.max(window.innerHeight, full) + 'px';
        var f = document.getElementById('app');
        if (f) { f.style.bottom = 'auto'; f.style.height = h; }
        // the loading screen too (it stopped at the shorter page height = the small band in the home-screen app)
        var bs = document.getElementById('bootScreen');
        if (bs) { bs.style.bottom = 'auto'; bs.style.height = Math.max(window.innerHeight, full) + 'px'; }
      }
      fit();
      document.addEventListener('DOMContentLoaded', fit);
      window.addEventListener('resize', fit);
      document.documentElement.classList.add('fd-standalone');
      window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    })();

    var APP_URL = 'https://script.google.com/macros/s/AKfycbzujaHNo4PGhxX0BiqqqmSsyK4xbLjaq_my-yLHNrcYI8RnsLuhaHwSBAOqmTA3dKoZuQ/exec';
    var KEY_NAME = 'GHL_DEVICE_KEY';
    var q = new URLSearchParams(location.search);
    var key = q.get('k') || '';
    if (key && key === window.__fdSignedOut) key = '';   // signed out on this device: the old key in the icon's address is not used
    try { if (!key) key = localStorage.getItem(KEY_NAME) || ''; } catch (e) {}
    document.getElementById('app').src = APP_URL + (key ? '?k=' + encodeURIComponent(key) : '');

    // How much of the page Safari's bottom toolbar covers right now; the app lifts its bottom bar by this much
    var insetTarget = null;
    // iPhone Safari (not the home-screen app): Safari draws the page from the very top of the screen (under the
    // status bar) and shows its toolbar over the bottom. The app is made as tall as the whole screen, so it also runs
    // under the toolbar like any website, and is told how much the status bar (top) and toolbar (bottom) cover.
    function iosSafari() { var c = document.documentElement.classList; return c.contains('fd-ios') && !c.contains('fd-standalone'); }
    function fullScreenHeight() {
      var portrait = window.matchMedia('(orientation: portrait)').matches;
      return portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    }
    function safeTop() { var d = document.createElement('div'); d.style.cssText = 'position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)'; document.body.appendChild(d); var h = d.getBoundingClientRect().height; d.remove(); return Math.round(h); }
    function insets() {
      if (!iosSafari()) return { top: 0, bottom: 0 };
      // Measured on iPhone SE + 13 Pro (15 Oct): the page starts below the status bar and reaches the bottom of the
      // screen = the largest page area Safari offers (100lvh) + its smallest toolbar (58). The app is made that tall
      // (so it runs under the toolbar) and lifts its bottom bar by whatever the toolbar covers right now.
      var lvh = document.getElementById('fdProbeL').getBoundingClientRect().height;
      var pageH = Math.round(Math.min(lvh + 58, Math.max(fullScreenHeight(), lvh)));
      var f = document.getElementById('app');
      if (f) { f.style.height = pageH + 'px'; document.body.style.minHeight = pageH + 'px'; }
      // the loading screen covers exactly what the app covers (it stopped at the visible part, leaving a band below)
      var bs = document.getElementById('bootScreen');
      if (bs) { bs.style.bottom = 'auto'; bs.style.height = (pageH + 160) + 'px'; }
      var vis = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      return { top: 0, bottom: Math.max(0, Math.round(pageH - vis)) };   // top: nothing extra (the page already starts below the status bar)
    }
    // Keyboard: tell the app which part of its screen is still visible above the keyboard (in the app's own coordinates),
    // so an open sheet can sit right on top of the keyboard instead of being covered by it (21 Oct)
    var lastKb = '';
    function sendKb() {
      var vv = window.visualViewport, fr = document.getElementById('app');
      if (!vv || !fr || !insetTarget) return;
      var r = fr.getBoundingClientRect();
      var top = Math.round(vv.offsetTop - r.top), bottom = Math.round(vv.offsetTop + vv.height - r.top);
      // iPhone: innerHeight shrinks with the keyboard (it never looked open) — compare with the page height, which stays put
      var open = vv.height < Math.max(window.innerHeight, document.documentElement.clientHeight) * 0.8;
      var key = open ? top + ',' + bottom : 'closed';
      if (key === lastKb) return; lastKb = key;
      try { insetTarget.w.postMessage({ type: 'ghl-kb', open: open, top: top, bottom: bottom }, insetTarget.o); } catch (e) {}
    }
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', sendKb); window.visualViewport.addEventListener('scroll', sendKb); }
    var lastInset = null;
    function sendInset() {
      // keyboard open: keep the last value (the visible area changes on every key while typing → the open form jumped)
      if (lastInset && typeof keyboardUp === 'function' && keyboardUp()) return;
      var i = insets();
      if (lastInset && lastInset.bottom === i.bottom && lastInset.top === i.top) return;
      lastInset = i;
      document.documentElement.style.setProperty('--host-bottom', i.bottom + 'px');
      if (insetTarget) { try { insetTarget.w.postMessage({ type: 'ghl-inset', bottom: i.bottom, top: i.top }, insetTarget.o); } catch (e) {} }
    }
    window.addEventListener('resize', sendInset);
    window.addEventListener('orientationchange', function () { setTimeout(sendInset, 300); });
    // while the keyboard is up, iPhone moves the page to keep the field above it: leave that alone (pulling the page back
    // on every key fought iPhone and made the screen flicker while typing the code); put it back once the keyboard closes
    function keyboardUp() { var vv = window.visualViewport; return !!vv && vv.height < window.innerHeight * 0.8; }
    function pinTop() { var c = document.documentElement.classList; if (!c.contains('fd-standalone') && !c.contains('fd-ios')) return; if (keyboardUp()) return; if (window.scrollY || window.scrollX || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = document.body.scrollTop = 0; } }
    window.addEventListener('scroll', pinTop, { passive: true });
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', pinTop); window.visualViewport.addEventListener('scroll', pinTop); }
    window.addEventListener('focusout', function () { setTimeout(pinTop, 50); setTimeout(pinTop, 400); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', sendInset);
    setTimeout(sendInset, 0);

    function hideBoot() {
      var h = document.documentElement;
      h.classList.remove('fd-launch');
      if (!h.classList.contains('boot') || h.classList.contains('fd-ready')) return;
      h.classList.add('fd-ready');
      setTimeout(function () { h.classList.remove('boot', 'boot-partner', 'fd-ready'); }, 300);
    }
    setTimeout(hideBoot, 45000);   // safety net: never cover the app for ever

    function fdApplyBg(bg) {
      var fdTheme = /^#(f2f2f7|f5f5f7)$/i.test(bg) ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', fdTheme);
      window.__fdTheme = fdTheme;
      if (window.__fdShown) { try { localStorage.setItem('GHL_FD_THEME', fdTheme); } catch (err) {} }
      document.documentElement.style.background = document.body.style.background = bg;
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', bg); });
    }
    window.addEventListener('message', function (e) {
      // only messages from the app itself (Google's script domains)
      if (!/^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/.test(e.origin)) return;
      var d = e.data || {};
      if (d.type === 'ghl-theme') {   // match the app's background, also behind the status bar and Safari's toolbar
        if (!/^#[0-9a-fA-F]{6}$/.test(d.bg || '')) return;
        // while the app is still loading it can report a passing theme (its own default before your saved choice arrives),
        // which flashed the loading screen dark → light: keep the theme remembered from last time until the app is showing
        if (!window.__fdShown && window.__fdSavedTheme) { window.__fdPendingBg = d.bg; return; }
        fdApplyBg(d.bg);
        return;
      }
      if (d.type === 'ghl-cache-save') {   // last data (compressed), so the app can show it at once next time
        try {
          if (!d.data || !d.who) localStorage.removeItem('GHL_DATA');
          else localStorage.setItem('GHL_DATA', JSON.stringify({ who: String(d.who), t: Date.now(), data: String(d.data) }));
        } catch (err) { try { localStorage.removeItem('GHL_DATA'); } catch (e2) {} }
        return;
      }
      if (d.type === 'ghl-cache-get') {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('GHL_DATA') || 'null'); } catch (err) {}
        var ok = saved && saved.who === String(d.who || '') && (Date.now() - saved.t) < 30 * 24 * 3600 * 1000;
        try { e.source.postMessage({ type: 'ghl-cache', who: ok ? saved.who : '', data: ok ? saved.data : '' }, e.origin); } catch (err) {}
        return;
      }
      // the app itself, kept compressed with its fingerprint (the app checks the fingerprint before using it)
      if (d.type === 'ghl-app-get') {
        var app = null;
        try { app = JSON.parse(localStorage.getItem('GHL_APP') || 'null'); } catch (err) {}
        try { e.source.postMessage({ type: 'ghl-app', fp: app && app.fp || '', data: app && app.data || '' }, e.origin); } catch (err) {}
        return;
      }
      if (d.type === 'ghl-app-save') {
        if (!/^[0-9a-f]{64}$/.test(String(d.fp || '')) || typeof d.data !== 'string' || d.data.length > 3000000) return;
        try { localStorage.setItem('GHL_APP', JSON.stringify({ fp: d.fp, data: d.data })); }
        catch (err) { try { localStorage.removeItem('GHL_APP'); } catch (e2) {} }
        return;
      }
      // the app scrolled the field being typed in to the top of its sheet: undo the page shift iOS made to reveal it
      if (d.type === 'ghl-pin') {
        if (window.scrollY || window.scrollX || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = document.body.scrollTop = 0; }
        return;
      }
      if (d.type === 'ghl-inset-request') { insetTarget = { w: e.source, o: e.origin }; lastInset = null; sendInset(); return; }
      if (d.type === 'ghl-ready') {
        if (d.role === 'admin' || d.role === 'partner') { try { localStorage.setItem('GHL_FD_ROLE', d.role); } catch (err) {} }
        window.__fdShown = true;
        if (window.__fdPendingBg) { fdApplyBg(window.__fdPendingBg); window.__fdPendingBg = ''; }   // the app's real theme, now it is showing
        if (window.__fdTheme) { try { localStorage.setItem('GHL_FD_THEME', window.__fdTheme); } catch (err) {} }
        hideBoot();
        return;
      }
      if (d.type !== 'ghl-device-key') return;
      var k = typeof d.key === 'string' ? d.key : '';
      try {
        if (k) { localStorage.setItem(KEY_NAME, k); localStorage.removeItem('GHL_SIGNED_OUT_KEY'); }
        else {   // signed out: remember which key that was (the home-screen icon may still carry it)
          var old = localStorage.getItem(KEY_NAME) || new URLSearchParams(location.search).get('k') || '';
          if (old) localStorage.setItem('GHL_SIGNED_OUT_KEY', old);
          localStorage.removeItem(KEY_NAME);
          localStorage.removeItem('GHL_APP');   // the next person may get the other app (admin / partner)
        }
      } catch (err) {}
      var dbg = /[?&]debug=1/.test(location.search) ? 'debug=1' : '';   // keep the measuring panel when the key is saved
      var qs = [k ? 'k=' + encodeURIComponent(k) : '', dbg].filter(Boolean).join('&');
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    });
  </script>
  <script>
    // Measuring panel for iPhone Safari layout (only with ?debug=1 in the address): sizes the page sees.
    (function () {
      if (!/[?&]debug=1/.test(location.search)) return;
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:8px;right:8px;top:40%;z-index:99999;background:rgba(255,0,0,.85);color:#fff;font:12px/1.4 -apple-system,monospace;padding:10px;border-radius:10px;white-space:pre-wrap;pointer-events:none';
      var probe = function (css) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;left:0;top:0;width:1px;visibility:hidden;' + css; document.body.appendChild(d); var h = d.getBoundingClientRect().height; d.remove(); return Math.round(h); };
      function show() {
        var f = document.getElementById('app').getBoundingClientRect(), vv = window.visualViewport;
        box.textContent = 'innerHeight ' + innerHeight + '  outer ' + outerHeight + '  screen ' + screen.height +
          '\nvh ' + probe('height:100vh') + '  lvh ' + probe('height:100lvh') + '  dvh ' + probe('height:100dvh') + '  svh ' + probe('height:100svh') +
          '\nsafe top ' + probe('height:env(safe-area-inset-top)') + '  safe bottom ' + probe('height:env(safe-area-inset-bottom)') +
          '\nvisualViewport ' + (vv ? Math.round(vv.height) + ' (offset ' + Math.round(vv.offsetTop) + ')' : '-') +
          '\nframe top ' + Math.round(f.top) + '  height ' + Math.round(f.height) + '  bottom ' + Math.round(f.bottom) +
          '\nscrollY ' + Math.round(scrollY) + '  docHeight ' + document.documentElement.scrollHeight +
          '\nbody ' + Math.round(document.body.getBoundingClientRect().height) + '  html ' + Math.round(document.documentElement.getBoundingClientRect().height) +
          '\nclasses ' + document.documentElement.className;
      }
      document.body.appendChild(box); show();
      setInterval(show, 1000);
    })();
  </script>
