  <script>
    // Front door start-up: the app-shaped loading screen is drawn at once (Google takes a few seconds to load the app),
    // in the theme and account type used last time, and stays until the app says it is ready.
    (function () {
      var h = document.documentElement, t = '', r = '';
      try { t = localStorage.getItem('GHL_FD_THEME') || ''; r = localStorage.getItem('GHL_FD_ROLE') || ''; } catch (e) {}
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      h.setAttribute('data-theme', t); h.classList.add('boot');
      if (r === 'partner') h.classList.add('boot-partner');
    })();
  </script>
  <title>GHL Boys Club</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    /* The app fills the whole screen. Google's "created by an Apps Script user" bar is only added when the
       app is opened directly, not when it is shown inside another page. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    @media (prefers-color-scheme: light) { html, body { background: #f2f2f7; } }
    @media (min-width: 769px) { html, body { background: #1e1e1e; } }
    @media (min-width: 769px) and (prefers-color-scheme: light) { html, body { background: #f5f5f7; } }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; border: 0; display: block; }   /* runs under Safari's floating toolbar, like a normal page */
    #fdProbeL, #fdProbeD { position: fixed; top: 0; left: 0; width: 1px; visibility: hidden; pointer-events: none; }
    #fdProbeL { height: 100lvh; } #fdProbeD { height: 100dvh; }
    /* Home-screen app on iPhone: the page height leaves out the status bar, so the app stopped short and a strip
       showed at the bottom. Add the status-bar height back (only in this mode; Safari itself is unchanged). */
    @media (display-mode: standalone) {
      html, body { height: calc(100vh + env(safe-area-inset-top)); }
      iframe { bottom: auto; height: calc(100vh + env(safe-area-inset-top)); }
    }
    /* ---------- start-up loading screen (exact copy of the app's own; see markup) ---------- */
    #bootScreen { display: none; }
    html.boot #loginContainer, html.boot #resumeNote { visibility: hidden !important; }
    html.boot #bootScreen {
      display: block; position: fixed; inset: 0; z-index: 50; overflow: hidden; pointer-events: none; box-sizing: border-box;
      --bs-win: #000; --bs-group: #1c1c1e; --bs-side: #262626; --bs-fill: rgba(255,255,255,0.07); --bs-hi: rgba(255,255,255,0.17); --bs-line: rgba(255,255,255,0.09);
      background: var(--bs-win);
    }
    html.boot[data-theme="light"] #bootScreen { --bs-win: #f2f2f7; --bs-group: #fff; --bs-side: #ebebed; --bs-fill: rgba(0,0,0,0.06); --bs-hi: rgba(0,0,0,0.02); --bs-line: rgba(0,0,0,0.08); }
    #bootScreen * { box-sizing: border-box; }
    @keyframes bsSweep { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    #bootScreen i { display: block; flex: 0 0 auto; border-radius: 7px; background-image: linear-gradient(90deg, var(--bs-fill) 0 35%, var(--bs-hi) 50%, var(--bs-fill) 65% 100%);
      background-size: 200% 100%; animation: bsSweep 1.6s linear infinite; }
    #bootScreen span { flex: 1 1 auto; }
    #bootScreen .bs-a-desk, #bootScreen .bs-a-phone, #bootScreen .bs-p-desk, #bootScreen .bs-p-phone { display: none; }
    #bootScreen .bs-c { width: 36px; height: 36px; border-radius: 50%; }

    /* phones (≤768px) */
    @media (max-width: 768px) {
      html.boot:not(.boot-partner) #bootScreen .bs-a-phone, html.boot.boot-partner #bootScreen .bs-p-phone { display: flex; }
      #bootScreen .bs-a-phone, #bootScreen .bs-p-phone { flex-direction: column; gap: 14px; height: 100%; padding: calc(14px + env(safe-area-inset-top)) 12px 0; }
      #bootScreen .bs-a-phone > *, #bootScreen .bs-p-phone > * { flex-shrink: 0; }   /* never squeezed (same sizes as the app) */
      #bootScreen .bs-p-phone { padding-left: calc(2.5vw + 6px); padding-right: calc(2.5vw + 6px); }
      #bootScreen .bs-bar { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 8px; border-radius: 26px; background: var(--bs-group); border: 0.5px solid var(--bs-line); }
      #bootScreen .bs-pill { width: 64px; height: 32px; border-radius: 16px; margin-left: 6px; }
      #bootScreen .bs-p-phone .bs-bar { padding-left: 16px; }
      #bootScreen .bs-pt { width: 120px; height: 18px; border-radius: 6px; }
      #bootScreen .bs-list { border-radius: 18px; background: var(--bs-group); overflow: hidden; border: 0.5px solid var(--bs-line); }
      #bootScreen .bs-list > div { display: grid; grid-template-columns: 36px 1fr 88px; grid-template-rows: auto auto; column-gap: 12px; row-gap: 6px; align-items: center;
        padding: 11px 14px; min-height: 56px; border-bottom: 0.5px solid var(--bs-line); }
      #bootScreen .bs-list > div:last-child { border-bottom: none; }
      #bootScreen .bs-ic { grid-row: 1 / 3; width: 36px; height: 36px; border-radius: 9px; }
      #bootScreen .bs-l1 { height: 12px; width: 60%; }
      #bootScreen .bs-l2 { grid-column: 2; height: 9px; width: 40%; }
      #bootScreen .bs-amt { grid-column: 3; grid-row: 1; height: 13px; }
      #bootScreen .bs-card { border-radius: 18px; background: var(--bs-group); border: 0.5px solid var(--bs-line); padding: 18px 12px 6px; display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; overflow: hidden; }
      #bootScreen .bs-ct { width: 225px; max-width: 50%; height: 16px; margin: 0 6px 6px; border-radius: 6px; }
      #bootScreen .bs-a-phone .bs-card { margin-top: 8px; flex: 1 1 0; min-height: 0; margin-bottom: 12px; gap: 18px; }   /* fills to 12px above the bottom, like the app */
      #bootScreen .bs-a-phone .bs-ct { margin-bottom: 4px; }
      #bootScreen .bs-tx { height: 88px; border-radius: 14px; position: relative; flex-shrink: 0; }
      #bootScreen .bs-pr { height: 56px; border-radius: 14px; }
      #bootScreen .bs-p-phone .bs-list > div { grid-template-columns: 36px 1fr 96px; }
      /* same see-through grey boxes as the app's phone loading screen */
      #bootScreen .bs-bar, #bootScreen .bs-list, #bootScreen .bs-card { background: rgba(127,127,127,0.10); border-color: rgba(127,127,127,0.18); }
      #bootScreen .bs-p-phone .bs-bar, #bootScreen .bs-p-phone .bs-list, #bootScreen .bs-p-phone .bs-card { background: rgba(127,127,127,0.12); }
      #bootScreen .bs-list > div { border-bottom-color: rgba(127,127,127,0.18); }

      #bootScreen .bs-tx::before { content: ''; position: absolute; left: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(127,127,127,0.22); }
      #bootScreen .bs-tx::after { content: ''; position: absolute; left: 54px; right: 14px; top: 18px; height: 54px;

      #bootScreen .bs-pr { position: relative; }
      #bootScreen .bs-pr::after { content: ''; position: absolute; left: 14px; right: 14px; top: 50%; height: 13px; margin-top: -6.5px;
        background: linear-gradient(rgba(127,127,127,0.24), rgba(127,127,127,0.24)) 0 0 / 34% 13px no-repeat,

      #bootScreen .bs-sc { position: relative; height: 132px; border-radius: 12px; background: var(--bs-group); border: 0.5px solid var(--bs-line); }
      #bootScreen .bs-sc i { position: absolute; }
      #bootScreen .bs-sct { left: 17px; top: 24px; width: 100px; height: 16px; }
      #bootScreen .bs-sci { right: 17px; top: 17px; width: 30px; height: 30px; }
      #bootScreen .bs-scv { left: 17px; top: 58px; width: 120px; height: 36px; }
      #bootScreen .bs-scf { left: 17px; top: 101px; width: 80px; height: 14px; }
      #bootScreen .bs-tbl { margin-top: 32px; flex: 1 1 0; min-height: 0; overflow: hidden; border-radius: 12px; background: var(--bs-group); border: 0.5px solid var(--bs-line);
        padding: 24px 24px 0; display: flex; flex-direction: column; gap: 8px; }
      #bootScreen .bs-row { height: 60px; flex: 0 0 60px; }
      /* partner: centred column, header, 5 cards, sections */

      #bootScreen .bs-pc { height: 144px; border-radius: 12px; background: var(--bs-group); border: 0.5px solid var(--bs-line); padding: 33px 32px 0; display: flex; flex-direction: column; gap: 8px; }
      #bootScreen .bs-pcl { width: 120px; height: 14px; }

      #bootScreen .bs-st { width: 200px; height: 24px; margin-bottom: 0; }

    html.boot #bootScreen { z-index: 10; transition: opacity .25s ease; }
    #bootScreen .bs-search, #bootScreen .bs-bolt { bottom: calc(14px + env(safe-area-inset-bottom) + var(--host-bottom, 0px)) !important; }
    html.boot.fd-ready #bootScreen { opacity: 0; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f2f2f7; }
    @media (min-width: 769px) { html[data-theme="light"], html[data-theme="light"] body { background: #f5f5f7; } }
  </style>

  <script>
    // "Keep me signed in": the app tells this page its device key, and this page keeps it in its own storage and
    // in its address (?k=…), so a phone home-screen icon opens straight in. The key goes back to the app on load.
    // Home-screen app on iPhone: the page height leaves out the status bar (and on some models iPhone reports that
    // as 0), so the app stopped short and a strip showed at the bottom. Size the app to the real screen height instead.
    (function () {
      var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!standalone) return;
      function fit() {
        var portrait = window.matchMedia('(orientation: portrait)').matches;
        var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        var h = Math.max(window.innerHeight, full) + 'px';
        document.documentElement.style.height = document.body.style.height = h;
        var f = document.getElementById('app');
        if (f) { f.style.bottom = 'auto'; f.style.height = h; }
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    })();

    var APP_URL = 'https://script.google.com/macros/s/AKfycbzujaHNo4PGhxX0BiqqqmSsyK4xbLjaq_my-yLHNrcYI8RnsLuhaHwSBAOqmTA3dKoZuQ/exec';
    var KEY_NAME = 'GHL_DEVICE_KEY';
    var q = new URLSearchParams(location.search);
    var key = q.get('k') || '';
    try { if (!key) key = localStorage.getItem(KEY_NAME) || ''; } catch (e) {}
    document.getElementById('app').src = APP_URL + (key ? '?k=' + encodeURIComponent(key) : '');

    // How much of the page Safari's bottom toolbar covers right now; the app lifts its bottom bar by this much
    var insetTarget = null;
    function bottomInset() {
      var l = document.getElementById('fdProbeL'), d = document.getElementById('fdProbeD');
      return (l && d) ? Math.max(0, Math.round(l.getBoundingClientRect().height - d.getBoundingClientRect().height)) : 0;
    }
    function sendInset() {
      var b = bottomInset();
      document.documentElement.style.setProperty('--host-bottom', b + 'px');
      if (insetTarget) { try { insetTarget.w.postMessage({ type: 'ghl-inset', bottom: b }, insetTarget.o); } catch (e) {} }
    }
    window.addEventListener('resize', sendInset);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', sendInset);
    setTimeout(sendInset, 0);

    function hideBoot() {
      var h = document.documentElement;
      if (!h.classList.contains('boot') || h.classList.contains('fd-ready')) return;
      h.classList.add('fd-ready');
      setTimeout(function () { h.classList.remove('boot', 'boot-partner', 'fd-ready'); }, 300);
    }
    setTimeout(hideBoot, 45000);   // safety net: never cover the app for ever

    window.addEventListener('message', function (e) {
      // only messages from the app itself (Google's script domains)
      if (!/^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/.test(e.origin)) return;
      var d = e.data || {};
      if (d.type === 'ghl-theme') {   // match the app's background, also behind the status bar and Safari's toolbar
        if (!/^#[0-9a-fA-F]{6}$/.test(d.bg || '')) return;
        try { localStorage.setItem('GHL_FD_THEME', /^#(f2f2f7|f5f5f7)$/i.test(d.bg) ? 'light' : 'dark'); } catch (err) {}
        document.documentElement.style.background = document.body.style.background = d.bg;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', d.bg); });
        return;
      }
      if (d.type === 'ghl-inset-request') { insetTarget = { w: e.source, o: e.origin }; sendInset(); return; }
      if (d.type === 'ghl-ready') {
        if (d.role === 'admin' || d.role === 'partner') { try { localStorage.setItem('GHL_FD_ROLE', d.role); } catch (err) {} }
        hideBoot();
        return;
      }
      if (d.type !== 'ghl-device-key') return;
      var k = typeof d.key === 'string' ? d.key : '';
      try { if (k) localStorage.setItem(KEY_NAME, k); else localStorage.removeItem(KEY_NAME); } catch (err) {}
      history.replaceState(null, '', location.pathname + (k ? '?k=' + encodeURIComponent(k) : ''));
    });
  </script>
</body>
</html>
